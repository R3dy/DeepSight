title: Command History Clearing
id: 17e8f9a0-b1c2-d3e4-f5a6-b7c8d9e0f1a2
status: stable
description: Detects clearing of bash command history
author: DeepSight Community
date: 2025/06/01
tags:
  - attack.defense_evasion
  - attack.t1070.003
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    CommandLine|contains:
      - 'history -c'
      - 'rm .bash_history'
      - 'unset HISTFILE'
      - 'ln -sf /dev/null ~/.bash_history'
  condition: selection
falsepositives:
  - Privacy-conscious users clearing history
level: low
