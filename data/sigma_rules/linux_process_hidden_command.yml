title: Hidden Process Command Line
id: 01a2b3c4-d5e6-f7a8-b9c0-d1e2f3a4b5c6
status: stable
description: Detects processes with hidden or empty command lines
author: DeepSight Community
date: 2025/06/01
tags:
  - attack.defense_evasion
  - attack.t1564
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    CommandLine|startswith: '['
    CommandLine|endswith: ']'
  condition: selection
falsepositives:
  - Kernel threads and daemon processes
level: medium
