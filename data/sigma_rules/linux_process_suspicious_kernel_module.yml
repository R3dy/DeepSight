title: Suspicious Kernel Module Loading
id: 18f9a0b1-c2d3-e4f5-a6b7-c8d9e0f1a2b3
status: stable
description: Detects loading of kernel modules using insmod/modprobe
author: DeepSight Community
date: 2025/06/01
tags:
  - attack.persistence
  - attack.t1547.006
logsource:
  category: process_creation
  product: linux
detection:
  sel_insmod:
    Image|endswith: '/insmod'
  sel_modprobe:
    Image|endswith: '/modprobe'
  sel_rmmod:
    Image|endswith: '/rmmod'
  condition: sel_insmod or sel_modprobe or sel_rmmod
falsepositives:
  - Legitimate kernel module operations
level: medium
