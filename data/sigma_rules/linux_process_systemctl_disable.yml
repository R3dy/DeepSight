title: Systemd Service Disabled
id: 41e2f3a4-b5c6-d7e8-f9a0-b1c2d3e4f5a6
status: stable
description: Detects disabling of systemd services
author: DeepSight Community
date: 2025/06/01
tags:
  - attack.defense_evasion
  - attack.t1562.001
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    Image|endswith: '/systemctl'
    CommandLine|contains: 'disable'
  condition: selection
falsepositives:
  - System administrators disabling services
level: low
