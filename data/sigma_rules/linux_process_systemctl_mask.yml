title: Systemd Service Masked
id: 49a0b1c2-d3e4-f5a6-b7c8-d9e0f1a2b3c4
status: stable
description: Detects masking of systemd services to prevent startup
author: DeepSight Community
date: 2025/06/01
tags:
  - attack.defense_evasion
  - attack.t1562.001
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    Image|endswith: '/systemctl'
    CommandLine|contains: 'mask'
  condition: selection
falsepositives:
  - System administrators masking services
level: medium
