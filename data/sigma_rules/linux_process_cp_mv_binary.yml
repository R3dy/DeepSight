title: Binary Copy to System Directory
id: 46d7e8f9-a0b1-c2d3-e4f5-a6b7c8d9e0f1
status: stable
description: Detects copying of binaries to system directories
author: DeepSight Community
date: 2025/06/01
tags:
  - attack.persistence
  - attack.t1543
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    Image|endswith:
      - '/cp'
      - '/mv'
    CommandLine|contains:
      - '/usr/bin/'
      - '/usr/sbin/'
      - '/usr/local/bin/'
  condition: selection
falsepositives:
  - Software installations
level: medium
