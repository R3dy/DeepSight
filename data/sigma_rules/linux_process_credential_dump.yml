title: Linux Credential Dumping Tools
id: 20b1c2d3-e4f5-a6b7-c8d9-e0f1a2b3c4d5
status: stable
description: Detects credential dumping tools like mimipenguin or linikatz
author: DeepSight Community
date: 2025/06/01
tags:
  - attack.credential_access
  - attack.t1003.007
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    CommandLine|contains:
      - 'mimipenguin'
      - 'linikatz'
      - 'mimikatz'
      - 'unshadow'
      - 'pwdump'
  condition: selection
falsepositives:
  - Penetration testing engagements
level: critical
