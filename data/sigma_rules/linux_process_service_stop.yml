title: Security Service Stopped
id: 30f1a2b3-c4d5-e6f7-a8b9-c0d1e2f3a4b5
status: stable
description: Detects stopping of security-related services
author: DeepSight Community
date: 2025/06/01
tags:
  - attack.defense_evasion
  - attack.t1562.001
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    Image|endswith:
      - '/systemctl'
      - '/service'
    CommandLine|contains:
      - 'stop'
  condition: selection
falsepositives:
  - Maintenance activities
level: medium
