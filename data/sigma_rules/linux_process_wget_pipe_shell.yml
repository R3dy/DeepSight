title: Wget Piped to Shell
id: 12f3a4b5-c6d7-e8f9-a0b1-c2d3e4f5a6b7
status: stable
description: Detects using wget/curl to download and execute scripts
author: DeepSight Community
date: 2025/06/01
tags:
  - attack.execution
  - attack.t1059.004
logsource:
  category: process_creation
  product: linux
detection:
  sel_wget:
    CommandLine|contains: 'wget '
    CommandLine|contains: '|'
  sel_curl:
    CommandLine|contains: 'curl '
    CommandLine|contains: '|'
  condition: sel_wget or sel_curl
falsepositives:
  - Common build scripts and package downloads
level: high
