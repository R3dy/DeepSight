title: File Content Manipulation via sed
id: 50b1c2d3-e4f5-a6b7-c8d9-e0f1a2b3c4d5
status: stable
description: Detects sed used to modify system configuration files
author: DeepSight Community
date: 2025/06/01
tags:
  - attack.defense_evasion
  - attack.t1562
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    Image|endswith: '/sed'
    CommandLine|contains:
      - '/etc/'
      - '-i'
  condition: selection
falsepositives:
  - Configuration management tools
level: low
