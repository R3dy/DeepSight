title: SSH Reverse Tunneling
id: 26b7c8d9-e0f1-a2b3-c4d5-e6f7a8b9c0d1
status: stable
description: Detects SSH reverse/remote port forwarding
author: DeepSight Community
date: 2025/06/01
tags:
  - attack.command_and_control
  - attack.t1572
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    Image|endswith: '/ssh'
    CommandLine|contains: '-R '
  condition: selection
falsepositives:
  - Legitimate SSH tunneling for remote access
level: medium
