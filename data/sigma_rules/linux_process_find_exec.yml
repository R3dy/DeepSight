title: Find Command with Execution
id: 51c2d3e4-f5a6-b7c8-d9e0-f1a2b3c4d5e6
status: stable
description: Detects find command used with -exec for privilege escalation
author: DeepSight Community
date: 2025/06/01
tags:
  - attack.privilege_escalation
  - attack.t1548
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    Image|endswith: '/find'
    CommandLine|contains: '-exec'
  condition: selection
falsepositives:
  - File management scripts
level: low
