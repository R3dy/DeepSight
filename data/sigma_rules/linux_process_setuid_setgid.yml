title: Setuid/Setgid Bit Setting
id: 22d3e4f5-a6b7-c8d9-e0f1-a2b3c4d5e6f7
status: stable
description: Detects setting the setuid or setgid bit on files
author: DeepSight Community
date: 2025/06/01
tags:
  - attack.privilege_escalation
  - attack.t1548.001
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    Image|endswith: '/chmod'
    CommandLine|contains:
      - 'u+s'
      - 'g+s'
      - '4777'
      - '4775'
  condition: selection
falsepositives:
  - Software installations setting permissions
level: high
