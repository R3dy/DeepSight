title: Process Execution from /tmp Directory
id: f1e3a7b8-4d6c-7e9f-2a0b-3c5e7f9a1b3d
status: stable
description: Detects process execution from /tmp or /dev/shm directories
author: DeepSight Community
date: 2025/06/01
tags:
  - attack.execution
  - attack.t1204.002
logsource:
  category: process_creation
  product: linux
detection:
  selection_tmp:
    Image|startswith: '/tmp/'
  selection_shm:
    Image|startswith: '/dev/shm/'
  selection_var_tmp:
    Image|startswith: '/var/tmp/'
  condition: selection_tmp or selection_shm or selection_var_tmp
falsepositives:
  - Package managers and install scripts that use /tmp
level: high
