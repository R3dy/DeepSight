title: Crontab Modification
id: 06f7a8b9-c0d1-e2f3-a4b5-c6d7e8f9a0b1
status: stable
description: Detects modification of system crontab files
author: DeepSight Community
date: 2025/06/01
tags:
  - attack.persistence
  - attack.t1053.003
logsource:
  category: file_event
  product: linux
detection:
  selection:
    TargetFilename|contains:
      - '/etc/crontab'
      - '/var/spool/cron/'
  condition: selection
falsepositives:
  - System administrators scheduling jobs
level: high
