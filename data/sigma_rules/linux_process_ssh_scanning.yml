title: SSH Scanning Tool Usage
id: 43a4b5c6-d7e8-f9a0-b1c2-d3e4f5a6b7c8
status: stable
description: Detects SSH scanning tools like hydra or medusa
author: DeepSight Community
date: 2025/06/01
tags:
  - attack.credential_access
  - attack.t1110
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    CommandLine|contains:
      - 'hydra'
      - 'medusa'
      - 'ncrack'
      - 'patator'
  condition: selection
falsepositives:
  - Authorized penetration testing
level: critical
