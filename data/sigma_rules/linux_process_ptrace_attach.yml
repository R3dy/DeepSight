title: Process Memory Access via ptrace
id: 21c2d3e4-f5a6-b7c8-d9e0-f1a2b3c4d5e6
status: stable
description: Detects process memory access using ptrace via gdb or strace
author: DeepSight Community
date: 2025/06/01
tags:
  - attack.credential_access
  - attack.t1055.001
logsource:
  category: process_creation
  product: linux
detection:
  sel_gdb:
    Image|endswith: '/gdb'
    CommandLine|contains: '-p'
  sel_strace:
    Image|endswith: '/strace'
    CommandLine|contains: '-p'
  condition: sel_gdb or sel_strace
falsepositives:
  - Developers debugging applications
level: medium
